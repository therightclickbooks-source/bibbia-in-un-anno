<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111319" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/favicon.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibbia">
<style>:root { padding-top: env(safe-area-inset-top, 0px); }</style>
<title>Bibbia in un anno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Una lettura al giorno per leggere tutta la Bibbia in 365 giorni, con uno spunto per la vita di oggi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Una colonna stretta come la pagina di una Bibbia tascabile: testo al centro,
   numeri di capitolo e versetto "rubricati" in rosso, un segnalibro a nastro
   che indica il giorno. Navigazione in basso, a portata di pollice. */
:root {
  --carta: #f4f4f0;
  --pagina: #ffffff;
  --inchiostro: #1c1e29;
  --grigio: #5c6070;
  --filo: #e1e0d9;
  --lapis: #2c4a94;
  --lapis-tenue: #e5eaf5;
  --rubrica: #a8322b;
  --su-lapis: #ffffff;
  --ombra: 0 1px 2px rgb(28 30 41 / .06), 0 8px 24px rgb(28 30 41 / .06);
  --f-testo: "Literata", Georgia, "Noto Serif", "Times New Roman", serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --dim: 19px;
  --misura: 36rem;
  --barra: 64px;
  --ev-giallo: #ffe27a; --ev-verde: #bfe8b4; --ev-azzurro: #bcdcff; --ev-rosa: #ffc6dd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #111319; --pagina: #191c24; --inchiostro: #e6e3da; --grigio: #9b9eab;
    --filo: #2a2e3a; --lapis: #92a9ee; --lapis-tenue: #1f2740; --rubrica: #e57d72;
    --su-lapis: #10131b; --ombra: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    --ev-giallo: rgb(222 182 40 / .42); --ev-verde: rgb(96 190 110 / .38); --ev-azzurro: rgb(96 150 240 / .42); --ev-rosa: rgb(232 110 160 / .40);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #111319; --pagina: #191c24; --inchiostro: #e6e3da; --grigio: #9b9eab;
  --filo: #2a2e3a; --lapis: #92a9ee; --lapis-tenue: #1f2740; --rubrica: #e57d72;
  --su-lapis: #10131b; --ombra: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  --ev-giallo: rgb(222 182 40 / .42); --ev-verde: rgb(96 190 110 / .38); --ev-azzurro: rgb(96 150 240 / .42); --ev-rosa: rgb(232 110 160 / .40);
  color-scheme: dark;
}
/* Temi scelti dentro l'app: vincono su quello del sistema */
html:root.t-chiaro {
  --carta: #f4f4f0; --pagina: #ffffff; --inchiostro: #1c1e29; --grigio: #5c6070;
  --filo: #e1e0d9; --lapis: #2c4a94; --lapis-tenue: #e5eaf5; --rubrica: #a8322b;
  --su-lapis: #ffffff; --ombra: 0 1px 2px rgb(28 30 41 / .06), 0 8px 24px rgb(28 30 41 / .06);
  --ev-giallo: #ffe27a; --ev-verde: #bfe8b4; --ev-azzurro: #bcdcff; --ev-rosa: #ffc6dd;
  color-scheme: light;
}
html:root.t-seppia {
  --carta: #efe5d0; --pagina: #f7efdd; --inchiostro: #3a2e22; --grigio: #75644f;
  --filo: #ddcfb3; --lapis: #34558a; --lapis-tenue: #e3dccb; --rubrica: #9c3a22;
  --su-lapis: #fbf6ea; --ombra: 0 1px 2px rgb(58 46 34 / .08), 0 8px 24px rgb(58 46 34 / .08);
  --ev-giallo: #f2d266; --ev-verde: #c6dea2; --ev-azzurro: #c1d5ea; --ev-rosa: #efc0c8;
  color-scheme: light;
}
html:root.t-notte {
  --carta: #111319; --pagina: #191c24; --inchiostro: #e6e3da; --grigio: #9b9eab;
  --filo: #2a2e3a; --lapis: #92a9ee; --lapis-tenue: #1f2740; --rubrica: #e57d72;
  --su-lapis: #10131b; --ombra: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  --ev-giallo: rgb(222 182 40 / .42); --ev-verde: rgb(96 190 110 / .38); --ev-azzurro: rgb(96 150 240 / .42); --ev-rosa: rgb(232 110 160 / .40);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--carta);
  color: var(--inchiostro);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--carta);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; border-radius: 4px; }

.app {
  max-width: 44rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--barra) + 32px + env(safe-area-inset-bottom, 0px));
}
.vista { display: grid; gap: 24px; }

/* ---------- etichette e titoli ---------- */
.occhiello {
  margin: 0;
  font: 600 12px/1.3 var(--f-ui);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--grigio);
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
.titolo {
  font: 600 clamp(28px, 7.4vw, 40px)/1.1 var(--f-testo);
  font-variation-settings: "opsz" 60;
  letter-spacing: -.01em;
}
.sez-titolo {
  font: 700 12px/1.3 var(--f-ui);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--rubrica);
}

/* ---------- testata del giorno con segnalibro ---------- */
.testata {
  position: relative;
  display: grid;
  gap: 10px;
  padding: 28px 64px 4px 0;
}
.nastro {
  position: absolute;
  top: -12px;
  right: 6px;
  width: 38px;
  height: 92px;
  background: var(--rubrica);
  color: var(--su-lapis);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
  display: grid;
  place-items: end center;
  padding-bottom: 22px;
  font: 700 13px/1 var(--f-ui);
  font-variant-numeric: tabular-nums;
}
.passi {
  margin: 0;
  font: 500 15px/1.4 var(--f-ui);
  color: var(--grigio);
  display: flex; flex-wrap: wrap; gap: 4px 12px;
}
.passi strong { color: var(--inchiostro); font-weight: 600; }
.avanzamento {
  height: 4px; border-radius: 4px; background: var(--filo); overflow: hidden;
}
.avanzamento > span { display: block; height: 100%; background: var(--lapis); border-radius: inherit; }

/* ---------- blocchi di riflessione ---------- */
.breve {
  display: grid; gap: 6px;
  padding: 16px 18px;
  background: var(--lapis-tenue);
  border-radius: 14px;
}
.breve p, .spunto p { margin: 0; font: 400 17px/1.55 var(--f-testo); font-variation-settings: "opsz" 16; }
.spunti { display: grid; gap: 22px; padding-top: 8px; border-top: 1px solid var(--filo); }
.spunto { display: grid; gap: 6px; }
.portare {
  margin: 0;
  padding: 20px 20px 16px;
  background: var(--pagina);
  border-radius: 14px;
  box-shadow: var(--ombra);
  display: grid; gap: 10px;
}
.portare blockquote {
  margin: 0;
  font: italic 400 19px/1.5 var(--f-testo);
  font-variation-settings: "opsz" 24;
}
.portare figcaption {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font: 600 14px/1.3 var(--f-ui); color: var(--grigio);
}
.nota-avviso { margin: 0; font-size: 13px; color: var(--grigio); }

/* ---------- testo biblico ---------- */
.testo {
  font-family: var(--f-testo);
  font-size: var(--dim);
  line-height: 1.68;
  font-variation-settings: "opsz" 14;
  max-width: var(--misura);
  hyphens: auto;
  -webkit-hyphens: auto;
}
.testo .libro-tit {
  margin: 28px 0 6px;
  font: 700 12px/1.3 var(--f-ui);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--grigio);
}
.testo .libro-tit:first-child { margin-top: 0; }
.cap { margin: 0 0 1.4em; }
.cap::after { content: ""; display: block; clear: both; }
.cap p { margin: 0 0 .7em; }
.capn {
  float: left;
  font: 600 3.1em/.82 var(--f-testo);
  font-variation-settings: "opsz" 72;
  color: var(--rubrica);
  margin: .1em .14em 0 0;
  font-variant-numeric: lining-nums;
}
.vn {
  font: 600 .58em/1 var(--f-ui);
  color: var(--rubrica);
  vertical-align: .55em;
  margin-right: .18em;
  font-variant-numeric: tabular-nums;
}
.senza-numeri .vn { display: none; }
.righe .cap p { margin: 0 0 .35em; }
.righe .capn { float: none; display: block; font-size: 2em; margin: 0 0 .25em; }
.v.trovato { background: color-mix(in srgb, var(--rubrica) 16%, transparent); border-radius: 3px; }
.testo .v { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.v.scelto { background: color-mix(in srgb, var(--lapis) 14%, transparent); border-radius: 3px; }

/* ---------- pulsanti ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--filo);
  background: var(--pagina);
  color: var(--inchiostro);
  border-radius: 999px;
  padding: 10px 16px;
  font: 600 15px/1.2 var(--f-ui);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px;
}
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--lapis); border-color: var(--lapis); color: var(--su-lapis); }
.btn.piccolo { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.grande { width: 100%; min-height: 56px; font-size: 17px; border-radius: 16px; }
.btn.fatto-si { background: var(--lapis-tenue); border-color: var(--lapis-tenue); color: var(--lapis); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.riga-btn { display: flex; gap: 10px; flex-wrap: wrap; }
.prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prevnext .btn { width: 100%; }

/* ---------- note personali ---------- */
.nota { display: grid; gap: 8px; }
.nota label { font: 600 15px/1.3 var(--f-ui); }
.nota textarea {
  width: 100%; min-height: 96px; resize: vertical;
  padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--filo); background: var(--pagina);
  font: 400 16px/1.5 var(--f-testo);
}
.nota small { color: var(--grigio); font-size: 13px; }

/* ---------- benvenuto ---------- */
.benvenuto {
  padding: 18px; border-radius: 14px; background: var(--pagina); box-shadow: var(--ombra);
  display: grid; gap: 10px;
}
.benvenuto p { margin: 0; font-size: 15px; }

/* ---------- piano ---------- */
.cifre { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cifra {
  padding: 14px 12px; border-radius: 14px; background: var(--pagina); box-shadow: var(--ombra);
  display: grid; gap: 2px;
}
.cifra b {
  font: 600 26px/1.1 var(--f-testo); font-variation-settings: "opsz" 48;
  font-variant-numeric: tabular-nums lining-nums;
}
.cifra span { font-size: 12px; color: var(--grigio); line-height: 1.3; }
.previsione { margin: 0; color: var(--grigio); font-size: 14px; }
.blocchi { display: grid; gap: 8px; }
.blocco { background: var(--pagina); border-radius: 14px; box-shadow: var(--ombra); overflow: hidden; }
.blocco summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  padding: 14px 16px;
}
.blocco summary::-webkit-details-marker { display: none; }
.blocco summary strong { font: 600 17px/1.25 var(--f-testo); font-variation-settings: "opsz" 24; min-width: 0; }
.blocco summary .conta { font-size: 13px; color: var(--grigio); font-variant-numeric: tabular-nums; }
.blocco summary .mini { grid-column: 1 / -1; height: 3px; background: var(--filo); border-radius: 3px; overflow: hidden; }
.blocco summary .mini span { display: block; height: 100%; background: var(--lapis); }
.giorni { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; }
.giorni button {
  width: 100%; border: 0; background: none; text-align: left;
  display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 22px; align-items: center; gap: 10px;
  padding: 10px 8px; border-radius: 10px;
}
.giorni button:hover { background: var(--lapis-tenue); }
.giorni .n { font: 600 14px/1 var(--f-ui); color: var(--grigio); font-variant-numeric: tabular-nums; }
.giorni .cosa { display: grid; min-width: 0; }
.giorni .cosa b { font-weight: 600; font-size: 15px; }
.giorni .cosa span { font-size: 13px; color: var(--grigio); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spunta {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--filo);
  display: grid; place-items: center; color: var(--su-lapis);
}
.spunta.si { background: var(--lapis); border-color: var(--lapis); }
.spunta svg { width: 14px; height: 14px; }
.giorni .attuale { background: var(--lapis-tenue); }

/* ---------- bibbia ---------- */
.cerca { display: flex; gap: 8px; }
.cerca input {
  flex: 1; min-width: 0; min-height: 46px; padding: 10px 14px;
  border-radius: 12px; border: 1px solid var(--filo); background: var(--pagina);
}
.testamento { display: grid; gap: 10px; }
.libri { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 8px; }
.libri button {
  border: 0; background: var(--pagina); box-shadow: var(--ombra); border-radius: 12px;
  padding: 12px; text-align: left; display: grid; gap: 2px; min-width: 0;
}
.libri b { font: 600 16px/1.2 var(--f-testo); font-variation-settings: "opsz" 20; }
.libri span { font-size: 12px; color: var(--grigio); }
.capitoli { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.1rem, 1fr)); gap: 8px; }
.capitoli button {
  aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 12px; background: var(--pagina); box-shadow: var(--ombra);
  font: 600 16px/1 var(--f-ui); font-variant-numeric: tabular-nums;
}
.desc-libro { margin: 0; font: 400 17px/1.5 var(--f-testo); color: var(--grigio); }
.risultati { display: grid; gap: 8px; }
.risultati button {
  border: 0; background: var(--pagina); box-shadow: var(--ombra); border-radius: 12px;
  padding: 12px 14px; text-align: left; display: grid; gap: 4px;
}
.risultati b { font-size: 13px; color: var(--rubrica); }
.risultati span { font: 400 16px/1.45 var(--f-testo); }
.risultati mark { background: color-mix(in srgb, var(--lapis) 22%, transparent); color: inherit; border-radius: 2px; }
.indietro {
  border: 0; background: none; padding: 6px 0; color: var(--lapis);
  font: 600 15px/1.2 var(--f-ui); display: inline-flex; align-items: center; gap: 4px; justify-self: start;
}
.indietro svg { width: 18px; height: 18px; }

/* ---------- opzioni ---------- */
.opzioni { display: grid; gap: 14px; }
.opz {
  background: var(--pagina); border-radius: 14px; box-shadow: var(--ombra);
  padding: 16px; display: grid; gap: 12px;
}
.opz h2 { font: 600 16px/1.3 var(--f-ui); }
.opz p { margin: 0; font-size: 14px; color: var(--grigio); }
.scelte { display: flex; flex-wrap: wrap; gap: 8px; }
.scelte button[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--su-lapis); }
.scala { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.scala input { width: 100%; accent-color: var(--lapis); }
.anteprima { font: 400 var(--dim)/1.6 var(--f-testo); margin: 0; }
.opz textarea {
  width: 100%; min-height: 90px; padding: 10px; border-radius: 10px; border: 1px solid var(--filo);
  background: var(--carta); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
}
.conferma { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stato-sync { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.stato-sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--grigio); flex: none; }
.stato-sync i.ok { background: #3a8f5c; }

/* ---------- barra in basso ---------- */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--carta) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--filo);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.barra nav { max-width: 44rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--barra); }
.barra button {
  border: 0; background: none; color: var(--grigio);
  display: grid; place-items: center; align-content: center; gap: 3px;
  font: 600 11px/1 var(--f-ui); letter-spacing: .01em;
  -webkit-tap-highlight-color: transparent;
}
.barra button svg { width: 24px; height: 24px; }
.barra button[aria-current="page"] { color: var(--lapis); }

.avviso {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--barra) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--inchiostro); color: var(--carta);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  z-index: 30; max-width: calc(100% - 32px); text-align: center;
}
.caricamento { color: var(--grigio); font-style: italic; font-family: var(--f-testo); }
.errore { padding: 14px; border-radius: 12px; background: var(--lapis-tenue); display: grid; gap: 10px; }

.fine-anno {
  padding: 22px; border-radius: 16px; background: var(--pagina); box-shadow: var(--ombra); display: grid; gap: 10px;
}

/* ---------- evidenziatore ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark.ev {
  color: inherit;
  background: linear-gradient(transparent 36%, var(--evc) 36%, var(--evc) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  border-radius: 2px; cursor: pointer;
}
.ev-giallo { --evc: var(--ev-giallo); }
.ev-verde { --evc: var(--ev-verde); }
.ev-azzurro { --evc: var(--ev-azzurro); }
.ev-rosa { --evc: var(--ev-rosa); }
.suggerimento { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--grigio); }
.suggerimento svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--rubrica); }
.azioni {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--barra) + env(safe-area-inset-bottom, 0px));
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--pagina); border-top: 1px solid var(--filo);
  box-shadow: 0 -8px 24px rgb(0 0 0 / .08);
}
.azioni-dentro { max-width: 44rem; margin: 0 auto; display: grid; gap: 10px; }
.azioni-riga { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.azioni-ref { flex: 1; min-width: 0; font: 700 15px/1.25 var(--f-ui); color: var(--rubrica); }
.azioni-et { font-size: 13px; font-weight: 600; color: var(--grigio); }
.pastelli { display: flex; gap: 10px; }
.pastello {
  width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0;
  background: var(--evc); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14);
}
.pastello[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--pagina), 0 0 0 4px var(--lapis); }
.chiudi {
  border: 0; background: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; color: var(--grigio);
}
.chiudi svg { width: 20px; height: 20px; }
.velo { position: fixed; inset: 0; z-index: 40; background: rgb(10 12 18 / .45); display: grid; align-items: end; }
.foglio {
  width: 100%; max-width: 44rem; margin: 0 auto; max-height: 88vh; overflow-y: auto;
  background: var(--pagina); border-radius: 18px 18px 0 0;
  padding-block: 16px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
.ev-cit { margin: 0; font: 400 19px/1.55 var(--f-testo); font-variation-settings: "opsz" 20; }
.ev-commento { display: grid; gap: 6px; }
.ev-commento label { font: 600 14px/1.3 var(--f-ui); }
.ev-commento textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--filo); background: var(--carta); font: 400 16px/1.45 var(--f-testo);
}
.ev-strumenti { display: grid; gap: 10px; }
.ev-filtri { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ev-filtri select, .ev-cerca {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px;
  border-radius: 12px; border: 1px solid var(--filo); background: var(--pagina);
}
.ev-lista { display: grid; gap: 12px; }
.ev-scheda { background: var(--pagina); border-radius: 14px; box-shadow: var(--ombra); padding: 16px; display: grid; gap: 10px; }
.ev-testa { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ev-ref { font: 700 14px/1.25 var(--f-ui); color: var(--rubrica); }
.ev-data { font-size: 12px; color: var(--grigio); }
.ev-piede { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ev-piede .pastello { width: 28px; height: 28px; }
.vuoto { padding: 20px; border-radius: 14px; background: var(--pagina); box-shadow: var(--ombra); display: grid; gap: 12px; }
.vuoto p { margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .vista { animation: entra .22s ease-out; }
  @keyframes entra { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
@media (min-width: 640px) {
  .app { padding-block-start: 28px; }
  .cifre { gap: 14px; }
}
</style>
</head>
<body>

<div class="app" id="app" aria-live="polite">
  <div class="vista"><p class="caricamento">Apro la Bibbia…</p></div>
</div>

<div class="barra">
  <nav aria-label="Sezioni">
    <button type="button" data-vai="oggi" id="nav-oggi">

      Oggi
    </button>
    <button type="button" data-vai="piano" id="nav-piano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h2M14 14h2M8 17h2"/></svg>
      Piano
    </button>
    <button type="button" data-vai="bibbia" id="nav-bibbia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M12 7v6M9.5 9.5h5"/></svg>
      Bibbia
    </button>
    <button type="button" data-vai="evidenziati" id="nav-evidenziati">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5-8 8H6.5v-5z"/><path d="M12 7l5 5M4 21h9"/></svg>
      Evidenziati
    </button>
    <button type="button" data-vai="opzioni" id="nav-opzioni">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>

<div class="azioni" id="azioni" hidden role="region" aria-label="Evidenziatore">
  <div class="azioni-dentro">

      <button class="chiudi" type="button" id="azioni-chiudi" aria-label="Annulla la scelta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

    <div class="azioni-riga">
      <span class="azioni-et">Evidenzia</span>

      <button class="btn piccolo" type="button" id="azioni-copia">Copia</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= utilità ================= */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* memoria non disponibile */ } },
};
const oggiISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const dataLunga = iso => { const [a, m, g] = iso.slice(0, 10).split('-').map(Number); return `${g} ${MESI[m - 1]} ${a}`; };
const dataBreve = iso => { const [, m, g] = iso.slice(0, 10).split('-').map(Number); return `${g} ${MESI[m - 1]}`; };
const ICONA = {
  spunta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  dx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  copia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  penna: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5-8 8H6.5v-5z"/><path d="M12 7l5 5M4 21h9"/></svg>',
};
let timerAvviso;
function avviso(msg) {
  let el = $('.avviso');
  if (!el) { el = document.createElement('div'); el.className = 'avviso'; el.setAttribute('role', 'status'); document.body.append(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(timerAvviso); timerAvviso = setTimeout(() => { el.hidden = true; }, 2600);
}

/* ================= dati ================= */
let LIBRI = [], PIANO = [], RIFL = [];
const LIB = {};      // id -> libro
const cacheLibri = new Map();
function libro(id) {
  if (!cacheLibri.has(id)) {
    const p = fetch(`data/libri/${id}.json`).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    p.catch(() => cacheLibri.delete(id));
    cacheLibri.set(id, p);
  }
  return cacheLibri.get(id);
}
const POESIA = new Set(['PSA', 'PRO', 'SNG', 'LAM']);

// "Sal 119,1-88" / "Genesi 1–3"
function citaSeg(seg, lungo) {
  const [b, c1, v1, c2, v2] = seg; const L = LIB[b];
  const nome = lungo ? L.nome : L.abbr;
  const intero = (c, a, z) => a === 1 && z === L.versetti[c - 1];
  if (L.versetti.length === 1) return intero(1, v1, v2) ? nome : `${nome} ${v1}-${v2}`;
  if (c1 === c2) return intero(c1, v1, v2) ? `${nome} ${c1}` : `${nome} ${c1},${v1}-${v2}`;
  const a = v1 === 1 ? `${c1}` : `${c1},${v1}`;
  const z = v2 === L.versetti[c2 - 1] ? `${c2}` : `${c2},${v2}`;
  return `${nome} ${a}–${z}`;
}
const citaGiorno = (p, lungo) => p.seg.map(s => citaSeg(s, lungo)).join(' · ');
const minuti = p => Math.max(3, Math.round(p.parole / 190));

/* ================= stato: progressi, note, impostazioni ================= */
const K_STATO = 'bibbia365.stato', K_NOTE = 'bibbia365.note', K_IMP = 'bibbia365.impostazioni', K_POS = 'bibbia365.posizione';
let stato = ls.get(K_STATO, null) || { fatti: {}, ts: 0 };
let note = ls.get(K_NOTE, {});
let imp = Object.assign({ dim: 19, tema: 'auto', numeri: true, righe: 'auto', benvenuto: true }, ls.get(K_IMP, {}));

const fatto = g => Boolean(stato.fatti[g]);
const contaFatti = () => Object.keys(stato.fatti).length;
const giornoCorrente = () => { for (let g = 1; g <= 365; g++) if (!fatto(g)) return g; return 365; };

function serie() {
  const giorni = new Set(Object.values(stato.fatti).map(d => d.slice(0, 10)));
  const d = new Date(); let n = 0;
  const iso = x => new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (!giorni.has(iso(d))) d.setDate(d.getDate() - 1);
  while (giorni.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// sincronizzazione con l'account Claude (capability db), se disponibile
const remoto = { db: null, uid: null, coda: new Map() };
const refRemoto = nome => remoto.db.doc(`data/users/${remoto.uid}/${nome}`);
function inCoda(nome, fai) {
  if (!remoto.db) return Promise.resolve(false);
  const prima = remoto.coda.get(nome) || Promise.resolve();
  const dopo = prima.then(fai).then(() => true, () => { remoto.errore = true; return false; });
  remoto.coda.set(nome, dopo);
  return dopo;
}
const scriviRemoto = (nome, dati) => inCoda(nome, () => refRemoto(nome).set(dati));
const cancellaRemoto = nome => inCoda(nome, () => refRemoto(nome).delete());
function salvaStato() {
  stato.ts = Date.now();
  ls.set(K_STATO, stato);
  scriviRemoto('progresso', { fatti: stato.fatti, ts: stato.ts });
}
async function collegaRemoto() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remoto.db = db; remoto.uid = uid;
    const snap = await refRemoto('progresso').get();
    const r = snap.exists ? snap.data() : null;
    if (r && (r.ts || 0) > (stato.ts || 0)) {
      stato = { fatti: Object.assign({}, r.fatti || {}), ts: r.ts };
      ls.set(K_STATO, stato);
      if (vista.nome !== 'opzioni') mostra(vista, { senzaScroll: true });
    } else if ((stato.ts || 0) > ((r && r.ts) || 0)) {
      await scriviRemoto('progresso', { fatti: stato.fatti, ts: stato.ts });
    }
    remoto.pronto = true;
    await sincronizzaEv().catch(() => {});
    if (vista.nome === 'opzioni' || vista.nome === 'evidenziati') mostra(vista, { senzaScroll: true });
    else aggiornaVersi();
    if (vista.nome === 'giorno') caricaNotaRemota(vista.g);
  } catch (e) { remoto.db = null; }
}
async function caricaNotaRemota(g) {
  if (!remoto.db) return;
  try {
    const snap = await refRemoto('nota-' + g).get();
    if (!snap.exists) return;
    const r = snap.data();
    const loc = note[g];
    if (!loc || (r.ts || 0) > (loc.ts || 0)) {
      note[g] = { t: r.t || '', ts: r.ts || 0 };
      ls.set(K_NOTE, note);
      const ta = $('#nota');
      if (ta && vista.nome === 'giorno' && vista.g === g && document.activeElement !== ta) ta.value = note[g].t;
    }
  } catch (e) { /* resta la copia locale */ }
}

function applicaImpostazioni() {
  const r = document.documentElement;
  r.classList.remove('t-chiaro', 't-seppia', 't-notte');
  if (imp.tema !== 'auto') r.classList.add('t-' + imp.tema);
  r.style.setProperty('--dim', imp.dim + 'px');
}
function salvaImp() { ls.set(K_IMP, imp); applicaImpostazioni(); }

/* ================= navigazione ================= */
let vista = { nome: 'oggi' };
function daHash(h) {
  h = (h || '').replace(/^#/, '');
  let m;
  if (h === 'piano' || h === 'bibbia' || h === 'opzioni' || h === 'evidenziati') return { nome: h };
  if ((m = h.match(/^g(\d{1,3})$/)) && +m[1] >= 1 && +m[1] <= 365) return { nome: 'giorno', g: +m[1] };
  if ((m = h.match(/^libro-([0-9A-Z]{3})$/)) && LIB[m[1]]) return { nome: 'libro', b: m[1] };
  if ((m = h.match(/^cap-([0-9A-Z]{3})-(\d+)(?:-(\d+))?$/)) && LIB[m[1]] && +m[2] <= LIB[m[1]].versetti.length) return { nome: 'capitolo', b: m[1], c: +m[2], v: m[3] ? +m[3] : 0 };
  return { nome: 'oggi' };
}
function aHash(v) {
  if (v.nome === 'giorno') return 'g' + v.g;
  if (v.nome === 'libro') return 'libro-' + v.b;
  if (v.nome === 'capitolo') return `cap-${v.b}-${v.c}` + (v.v ? '-' + v.v : '');
  return v.nome;
}
function vai(v) {
  try { history.pushState(null, '', '#' + aHash(v)); } catch (e) { /* cornice senza cronologia */ }
  mostra(v);
}
window.addEventListener('popstate', () => mostra(daHash(location.hash)));
document.querySelector('.barra').addEventListener('click', e => {
  const b = e.target.closest('[data-vai]'); if (!b) return;
  vai({ nome: b.dataset.vai });
});

let salvaPosTimer;
window.addEventListener('scroll', () => {
  if (vista.nome !== 'giorno') return;
  clearTimeout(salvaPosTimer);
  salvaPosTimer = setTimeout(() => ls.set(K_POS, { g: vista.g, y: Math.round(window.scrollY) }), 400);
}, { passive: true });

function mostra(v, opt = {}) {
  if (v.nome === 'oggi') v = { nome: 'giorno', g: giornoCorrente(), daOggi: true };
  vista = v;
  chiudiAzioni(); chiudiFoglio();
  const tab = { giorno: 'oggi', piano: 'piano', bibbia: 'bibbia', libro: 'bibbia', capitolo: 'bibbia', evidenziati: 'evidenziati', opzioni: 'opzioni' }[v.nome];
  document.querySelectorAll('.barra [data-vai]').forEach(b => {
    if (b.dataset.vai === tab && (tab !== 'oggi' || v.daOggi || v.g === giornoCorrente())) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const r = { giorno: vistaGiorno, piano: vistaPiano, bibbia: vistaBibbia, libro: vistaLibro, capitolo: vistaCapitolo, evidenziati: vistaEvidenziati, opzioni: vistaOpzioni }[v.nome](v, opt);
  if (!opt.senzaScroll && !r?.scrollGestito) window.scrollTo(0, 0);
}

/* ================= rendering del testo ================= */
const ATTACCHI = /^(Or |Ora |Poi |Allora |E avvenne|Avvenne|Dopo |In quel tempo|In quei giorni|Quando |Così |E Gesù |Gesù |Ed ecco|Ecco )/;
function paragrafi(vv, da) {
  const out = []; let cur = [];
  vv.forEach((t, i) => {
    const prima = i > 0 ? vv[i - 1] : '';
    const chiude = /[.!?”’»]\s*$/.test(prima);
    if (cur.length && chiude && ((cur.length >= 3 && ATTACCHI.test(t)) || cur.length >= 6)) { out.push(cur); cur = []; }
    cur.push({ n: da + i, t });
  });
  if (cur.length) out.push(cur);
  return out;
}
function htmlCapitolo(b, c, testo, a, z, mostraNum) {
  const vv = testo.slice(a - 1, z);
  const righe = imp.righe === 'sempre' || (imp.righe === 'auto' && POESIA.has(b));
  const gruppi = righe ? vv.map((t, i) => [{ n: a + i, t }]) : paragrafi(vv, a);
  const capn = mostraNum ? `<span class="capn" aria-label="Capitolo ${c}">${c}</span>` : '';
  const lista = evVivi();
  return `<section class="cap" aria-label="${esc(LIB[b].nome)} capitolo ${c}">` + gruppi.map((gr, i) =>
    `<p>${i === 0 ? capn : ''}${gr.map(v => `<span class="v" id="v-${b}-${c}-${v.n}" data-b="${b}" data-c="${c}" data-v="${v.n}"><sup class="vn">${v.n}</sup><span class="vt">${htmlVerso(v.t, segmentiVerso(lista, b, c, v.n, v.t.length))}</span> </span>`).join('')}</p>`
  ).join('') + '</section>';
}
async function htmlSegmenti(seg) {
  const parti = [];
  for (const [b, c1, v1, c2, v2] of seg) {
    const t = await libro(b);
    parti.push(`<h2 class="libro-tit">${esc(LIB[b].nome)}</h2>`);
    for (let c = c1; c <= c2; c++) {
      const a = c === c1 ? v1 : 1, z = c === c2 ? v2 : t[c - 1].length;
      parti.push(htmlCapitolo(b, c, t[c - 1], a, z, true));
    }
  }
  return parti.join('');
}
function classiTesto() { return 'testo' + (imp.numeri ? '' : ' senza-numeri') + (imp.righe === 'sempre' ? ' righe' : ''); }
function erroreTesto(dove, riprova) {
  dove.innerHTML = `<div class="errore"><p>Non riesco a caricare il testo. Controlla la connessione e riprova.</p><button class="btn piccolo" type="button">Riprova</button></div>`;
  dove.querySelector('button').onclick = riprova;
}

/* ================= vista: giorno ================= */
function vistaGiorno(v) {
  const g = v.g, p = PIANO[g - 1], r = RIFL[g - 1] || null;
  const fattoIl = stato.fatti[g];
  const n = contaFatti();
  const benvenuto = imp.benvenuto && n === 0 && g === 1;
  app.innerHTML = `<article class="vista giorno">
    ${benvenuto ? `<div class="benvenuto">
      <p class="occhiello">Come funziona</p>
      <p>Una lettura al giorno, circa 10 minuti: in 365 letture leggi tutta la Bibbia, dalla Genesi all’Apocalisse. Prima del testo trovi due righe per orientarti, dopo uno spunto per la vita di oggi.</p>
      <p>Se salti un giorno non resti indietro: l’app riparte sempre dalla prima lettura che non hai segnato.</p>
      <div><button class="btn piccolo" type="button" id="chiudi-benvenuto">Ho capito</button></div>
    </div>` : ''}
    <header class="testata">
      <div class="nastro" aria-hidden="true">${g}</div>
      <p class="occhiello">Giorno ${g} di 365 · ${esc(p.blocco)}</p>
      <h1 class="titolo">${esc(r ? r.t : citaGiorno(p, true))}</h1>
      <p class="passi"><strong>${esc(citaGiorno(p, true))}</strong><span>circa ${minuti(p)} minuti</span>${fattoIl ? `<span>letto il ${dataBreve(fattoIl)}</span>` : ''}</p>
      <div class="avanzamento" role="progressbar" aria-label="Bibbia letta" aria-valuemin="0" aria-valuemax="365" aria-valuenow="${n}"><span style="width:${(n / 365 * 100).toFixed(2)}%"></span></div>
    </header>
    ${r ? `<section class="breve"><h2 class="sez-titolo">In breve</h2><p>${esc(r.b)}</p></section>` : ''}
    ${evVivi().length ? '' : `<p class="suggerimento">${ICONA.penna}<span>Tocca un versetto per evidenziarlo, oppure tieni premuto e trascina per scegliere solo una frase.</span></p>`}
    <div class="${classiTesto()}" id="testo"><p class="caricamento">Carico il testo…</p></div>
    ${r ? `<div class="spunti">
      <section class="spunto"><h2 class="sez-titolo">Oggi</h2><p>${esc(r.o)}</p></section>
      <section class="spunto"><h2 class="sez-titolo">Per vivere meglio</h2><p>${esc(r.p)}</p></section>
      <figure class="portare" id="portare" hidden></figure>
      <p class="nota-avviso">Gli spunti sono riflessioni personali per collegare il testo alla vita di oggi: non fanno parte della Bibbia.</p>
    </div>` : ''}
    <div class="nota">
      <label for="nota">I tuoi pensieri</label>
      <textarea id="nota" placeholder="Una frase che ti ha colpito, una domanda, un proposito per oggi…">${esc((note[g] && note[g].t) || '')}</textarea>
      <small id="nota-stato">${remoto.db ? 'Si salva da sola, nel tuo account.' : 'Si salva da sola, su questo dispositivo.'}</small>
    </div>
    <button class="btn grande ${fattoIl ? 'fatto-si' : 'primario'}" type="button" id="segna">${fattoIl ? ICONA.spunta + ' Letto · tocca per annullare' : 'Segna come letto'}</button>
    <nav class="prevnext" aria-label="Altri giorni">

async function mostraVersetto(ref, fig) {
  const [b, c, a, z] = ref;
  try {
    const t = await libro(b);
    const fine = z || a;
    const testo = t[c - 1].slice(a - 1, fine).join(' ');
    const cita = `${LIB[b].abbr} ${c},${a}${fine > a ? '-' + fine : ''}`;
    fig.innerHTML = `<p class="sez-titolo">Da portare con te</p><blockquote>${esc(testo)}</blockquote>
      <figcaption><span>${esc(cita)}</span><button class="btn piccolo" type="button">${ICONA.copia} Copia</button></figcaption>`;
    fig.hidden = false;
    fig.querySelector('button').onclick = () => copia(`«${testo}» (${cita})`, fig.querySelector('blockquote'));
  } catch (e) { /* senza versetto: il resto resta leggibile */ }
}
function copia(testo, el) {
  const fallback = () => {
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(el); s.removeAllRanges(); s.addRange(r);
    avviso('Testo selezionato: tienilo premuto per copiarlo');
  };
  try {
    navigator.clipboard.writeText(testo).then(() => avviso('Copiato'), fallback);
  } catch (e) { fallback(); }
}

const normalizza = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’‘`]/g, "'").toLowerCase();

function vistaBibbia() {

  }));

async function cerca(q) {
  ultimaRicerca = q;
  const out = $('#risultati');
  if (q.length < 3) { out.innerHTML = q ? '<p class="previsione">Scrivi almeno tre lettere.</p>' : ''; return; }
  out.innerHTML = '<p class="caricamento">Cerco in tutta la Bibbia…</p>';
  let testi;
  try { testi = await Promise.all(LIBRI.map(l => libro(l.id))); }
  catch (e) { erroreTesto(out, () => cerca(q)); return; }
  if (ultimaRicerca !== q || !$('#risultati')) return;
  const nq = normalizza(q), trovati = []; let tot = 0;
  LIBRI.forEach((l, i) => testi[i].forEach((cap, ci) => cap.forEach((t, vi) => {
    if (normalizza(t).includes(nq)) { tot++; if (trovati.length < 150) trovati.push([l.id, ci + 1, vi + 1, t]); }
  })));
  const evid = t => {
    const nt = normalizza(t), i = nt.indexOf(nq);
    if (i < 0 || nt.length !== t.length) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
  };
  out.innerHTML = `<p class="previsione">${tot === 0 ? 'Nessun versetto trovato.' : tot === 1 ? '1 versetto trovato.' : `${tot} versetti trovati${tot > trovati.length ? `, mostro i primi ${trovati.length}` : ''}.`}</p>` +

    const [lb, c, v] = b.dataset.ref.split('-');
    vai({ nome: 'capitolo', b: lb, c: +c, v: +v });
  };
}

/* ================= evidenziatore ================= */
// Un evidenziato va da (c1, v1, carattere o1) a (c2, v2, carattere o2) dentro un libro.
const K_EV = 'bibbia365.evidenziati';
const COLORI = [['giallo', 'Giallo'], ['verde', 'Verde'], ['azzurro', 'Azzurro'], ['rosa', 'Rosa']];
let EV = ls.get(K_EV, {});
const evVivi = () => Object.values(EV).filter(e => !e.del);
const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const salvaEvLocale = () => ls.set(K_EV, EV);
const nomeEv = id => `archivio/evidenziati/${id}`;
const campiEv = e => { const { id, sync, ...resto } = e; return resto; };
const isoLocale = ms => { const d = new Date(ms); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString(); };
// (c1, v1) viene prima di (c2, v2)?
const prima = (c1, v1, c2, v2) => c1 < c2 || (c1 === c2 && v1 < v2);

function scriviEv(e) {
  salvaEvLocale();
  scriviRemoto(nomeEv(e.id), campiEv(e)).then(ok => {
    if (ok && EV[e.id] && EV[e.id].ts === e.ts) { EV[e.id].sync = true; salvaEvLocale(); }
  });
}
function eliminaEv(id) {
  const e = EV[id]; if (!e) return;
  if (!e.sync) { delete EV[id]; salvaEvLocale(); return; }
  EV[id] = { id, del: true, ts: Date.now(), sync: true };
  salvaEvLocale();

}
let tNotaEv = {};
function aggiornaNotaEv(id, testo) {

// unisce la copia sul telefono con quella nell'account: vince la modifica più recente
async function sincronizzaEv() {
  if (!remoto.db) return;
  const snap = await remoto.db.doc(`data/users/${remoto.uid}/archivio`).collection('evidenziati').limit(1000).get();
  const R = {};
  snap.docs.forEach(d => { R[d.id] = d.data(); });
  for (const id of new Set([...Object.keys(R), ...Object.keys(EV)])) {
    const r = R[id], l = EV[id];
    if (r && (!l || (r.ts || 0) > (l.ts || 0))) { EV[id] = Object.assign({}, r, { id, sync: true }); continue; }
    if (!l) continue;
    if (l.del) { if (r) cancellaRemoto(nomeEv(id)).then(ok => { if (ok) { delete EV[id]; salvaEvLocale(); } }); else delete EV[id]; continue; }
    if (!r && l.sync) { delete EV[id]; continue; } // cancellato da un altro dispositivo
    if (!r || (l.ts || 0) > (r.ts || 0)) scriviEv(l); else l.sync = true;
  }
  salvaEvLocale();
}

function citaEv(e, lungo = true) {
  const L = LIB[e.b], nome = lungo ? L.nome : L.abbr;
  if (L.versetti.length === 1) return `${nome} ${e.v1}${e.v2 > e.v1 ? '-' + e.v2 : ''}`;
  if (e.c1 === e.c2) return `${nome} ${e.c1},${e.v1}${e.v2 > e.v1 ? '-' + e.v2 : ''}`;
  return `${nome} ${e.c1},${e.v1}–${e.c2},${e.v2}`;
}
async function testoDi(r) {
  const t = await libro(r.b), parti = [];
  for (let c = r.c1; c <= r.c2; c++) {
    const vv = t[c - 1];
    for (let v = c === r.c1 ? r.v1 : 1; v <= (c === r.c2 ? r.v2 : vv.length); v++) {
      const s = vv[v - 1];
      parti.push(s.slice(c === r.c1 && v === r.v1 ? r.o1 : 0, c === r.c2 && v === r.v2 ? r.o2 : s.length));
    }
  }
  return parti.join(' ').replace(/\s+/g, ' ').trim();
}

// i tratti evidenziati dentro un versetto, in caratteri
function segmentiVerso(lista, b, c, v, len) {
  const out = [];
  for (const e of lista) {
    if (e.b !== b || prima(c, v, e.c1, e.v1) || prima(e.c2, e.v2, c, v)) continue;
    const a = c === e.c1 && v === e.v1 ? e.o1 : 0;
    const z = c === e.c2 && v === e.v2 ? Math.min(e.o2, len) : len;
    if (z > a) out.push({ a, z, col: e.col, id: e.id, cr: e.cr || 0 });
  }
  return out;
}
function htmlVerso(t, segs) {
  if (!segs.length) return esc(t);
  const punti = [...new Set([0, t.length, ...segs.flatMap(s => [s.a, s.z])])]
    .map(x => Math.max(0, Math.min(t.length, x))).sort((x, y) => x - y);
  let h = '';
  for (let i = 0; i < punti.length - 1; i++) {
    const a = punti[i], z = punti[i + 1];
    if (z <= a) continue;
    const sopra = segs.filter(s => s.a <= a && s.z >= z).sort((x, y) => y.cr - x.cr)[0];
    const pezzo = esc(t.slice(a, z));
    h += sopra ? `<mark class="ev ev-${sopra.col}" data-ev="${sopra.id}">${pezzo}</mark>` : pezzo;
  }
  return h;
}
function aggiornaVersi() {
  const box = $('#testo'); if (!box) return;
  const lista = evVivi();
  box.querySelectorAll('.v').forEach(s => {
    const vt = s.querySelector('.vt'), t = vt.textContent;
    vt.innerHTML = htmlVerso(t, segmentiVerso(lista, s.dataset.b, +s.dataset.c, +s.dataset.v, t.length));
  });
}
const pastelli = (scelto, grande) => COLORI.map(([k, nome]) =>

// ----- scelta del testo: versetti toccati o frase selezionata -----
const scelta = { modo: null, i1: -1, i2: -1, sel: null };
const barraAz = $('#azioni');
const spanTesto = () => { const box = $('#testo'); return box ? [...box.querySelectorAll('.v')] : []; };
const lunghezza = s => s.querySelector('.vt').textContent.length;

function rangeCorrente() {
  if (scelta.modo === 'sel') return scelta.sel;
  if (scelta.modo !== 'versi') return null;
  const ss = spanTesto(), s1 = ss[scelta.i1], s2 = ss[scelta.i2];
  if (!s1 || !s2) return null;
  return { b: s1.dataset.b, c1: +s1.dataset.c, v1: +s1.dataset.v, o1: 0, c2: +s2.dataset.c, v2: +s2.dataset.v, o2: lunghezza(s2) };
}
function rangeDaSelezione() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const rg = sel.getRangeAt(0), box = $('#testo');
  if (!box || !box.contains(rg.commonAncestorContainer)) return null;
  const spans = [...box.querySelectorAll('.v')].filter(s => rg.intersectsNode(s));
  if (!spans.length) return null;
  const pos = (span, nodo, off, inizio) => {
    const vt = span.querySelector('.vt'), len = vt.textContent.length;
    if (vt.contains(nodo)) { const r = document.createRange(); r.setStart(vt, 0); r.setEnd(nodo, off); return r.toString().length; }
    if (span.querySelector('.vn').contains(nodo)) return 0;
    if (nodo === span) return off <= [...span.childNodes].indexOf(vt) ? 0 : len;
    if (span.contains(nodo)) return len; // lo spazio dopo il versetto
    return inizio ? 0 : len;
  };
  let s1 = spans[0], s2 = spans[spans.length - 1];
  let o1 = pos(s1, rg.startContainer, rg.startOffset, true);
  let o2 = pos(s2, rg.endContainer, rg.endOffset, false);
  if (o1 >= lunghezza(s1) && spans.length > 1) { spans.shift(); s1 = spans[0]; o1 = 0; }
  if (o2 <= 0 && spans.length > 1) { spans.pop(); s2 = spans[spans.length - 1]; o2 = lunghezza(s2); }
  if (s1.dataset.b !== s2.dataset.b) return { errore: 'Scegli un testo dentro un solo libro' };
  const t1 = s1.querySelector('.vt').textContent, t2 = s2.querySelector('.vt').textContent;
  while (o1 < t1.length && /\s/.test(t1[o1])) o1++;
  while (o2 > 0 && /\s/.test(t2[o2 - 1])) o2--;
  if (s1 === s2 && o2 <= o1) return null;
  return { b: s1.dataset.b, c1: +s1.dataset.c, v1: +s1.dataset.v, o1, c2: +s2.dataset.c, v2: +s2.dataset.v, o2 };
}
function segnaScelti() {

}

}

let tSel;
document.addEventListener('selectionchange', () => {

function testoFileEv(lista) {

async function scaricaEv(lista) {

  const testo = testoFileEv(lista), nome = `evidenziati-bibbia-${oggiISO()}.txt`;
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    const dl = await c.use('downloads').catch(() => null);
    if (dl) {
      try { await dl.save({ filename: nome, data: testo }); avviso('File salvato'); }
      catch (err) { if (!err || err.code !== 'declined') avviso('Qui non riesco a salvare il file: usa «Copia tutto»'); }
      return;
    }
    if (window.top !== window) { avviso('Qui non riesco a salvare il file: usa «Copia tutto»'); return; }
  }
  const url = URL.createObjectURL(new Blob([testo], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  avviso('File scaricato');
}
